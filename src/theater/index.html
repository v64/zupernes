<!DOCTYPE html>
<!-- ZuperNES browser theater.
     A wholly local page: the user's own ROM files only, no network I/O
     beyond the localhost static server that shipped this page. The wasm
     (src/theater/zupernes.wasm, built by `zig build theater`) runs the
     REAL emulator core; this page only moves bytes and presents frames.
     Test hooks (#screen #file #pause #reset #forget #sound #crt #status
     and ?test=1's window.__zupernesTest) are specified in
     test/theater/TASK.md and measured by browser-check.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZuperNES Theater</title>
<link rel="stylesheet" href="css/theater.css">
</head>
<body>
<div id="stage">
  <canvas id="screen" width="256" height="224" aria-label="SNES display"></canvas>
  <div id="drop" hidden>
    <b>Drop a .sfc / .smc cartridge</b><br>
    or use <i>Load ROM</i> below, then press <i>Play</i>.
    <small>Everything runs locally in your browser; nothing is uploaded.</small>
  </div>
  <div id="start-overlay" hidden>
    <button id="start-session" type="button" aria-label="Start emulation">▶ Play</button>
  </div>
</div>

<div id="bar">
  <div class="toolbar-section">
    <button id="load" type="button">Load ROM…</button>
    <input id="file" type="file" accept=".sfc,.smc" hidden aria-label="ROM file picker">
  </div>
  <div class="toolbar-section">
    <button id="pause" type="button">⏸ Pause</button>
    <button id="reset" type="button">⟳ Reset</button>
  </div>
  <div class="toolbar-section">
    <button id="sound" type="button">🔊 Sound: On</button>
    <button id="crt" type="button">🖥 CRT: On</button>
  </div>
  <div class="toolbar-section">
    <button id="forget" type="button">Erase Save</button>
  </div>
</div>
<div id="title">no cartridge</div>
<div id="status">drop or load a cartridge to begin</div>

<section id="keyboard" aria-label="Controller mapping">
  <h2>Controller 1</h2>
  <!-- Laid out like the SNES controller itself: shoulders on top, the
       WASD cross as the D-pad, Select/Start in the middle, and the face
       buttons in their controller positions (X top, Y left, A right,
       B bottom). The bindings are unchanged; see KEYMAP in js/main.mjs. -->
  <div class="pad">
    <span class="key shoulder sl"><b>Q</b><small>L</small></span>
    <span class="key shoulder sr"><b>E</b><small>R</small></span>
    <div class="dpad">
      <span class="key up"><b>W</b><small>Up</small></span>
      <span class="key left"><b>A</b><small>Left</small></span>
      <span class="key right"><b>D</b><small>Right</small></span>
      <span class="key down"><b>S</b><small>Down</small></span>
    </div>
    <div class="mid">
      <span class="key pill"><b>U</b><small>Select</small></span>
      <span class="key pill"><b>O</b><small>Start</small></span>
    </div>
    <div class="face">
      <span class="key round up btn-x"><b>P</b><small>X</small></span>
      <span class="key round left btn-y"><b>J</b><small>Y</small></span>
      <span class="key round right btn-a"><b>L</b><small>A</small></span>
      <span class="key round down btn-b"><b>K</b><small>B</small></span>
    </div>
  </div>
</section>

<script type="module" src="js/main.mjs"></script>
</body>
</html>
